name = "cmd-task-errors"
kind = "differential"
requires = ["task show", "task cancel"]
description = """
Task error paths and their exit codes, all measured: a missing task is 1, \
and an empty title, a priority outside 1-4, an unknown assignee and an \
unknown dependency are all 2. The invalid-transition message keeps its \
U+2192 arrow even under --ascii, because it is built in the domain layer, \
which knows nothing about the flag — that asymmetry is exactly what an \
over-eager glyph pass would break."""
steps = [
  "init --name proj --adapter claude",
  "task show tsk_nosuch",
  "task cancel tsk_nosuch",
  "task edit tsk_nosuch",
  "task add ''",
  "task add 'Bad priority' --priority 0",
  "task add 'Bad priority' --priority 5",
  "task add 'Bad priority' --priority notanumber",
  "task add 'Unknown assignee' --assignee agt_nosuch",
  "task add 'Unknown dep' --depends-on tsk_nosuch",
  "task add 'ok' --quiet",
  "task cancel ${task.0}",
  "task cancel ${task.0}",
  "--ascii task cancel ${task.0}",
  "task assign ${task.0} agt_nosuch",
  "task list --json",
]
