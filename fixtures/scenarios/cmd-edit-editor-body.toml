name = "cmd-edit-editor-body"
kind = "differential"
requires = ["task edit", "agent edit"]
fake_editor = "orch-edit-body"
description = """
The other half of the editor protocol: an edit that rewrites only the \
body, which is the task description and the agent role. The frontmatter \
must come back unchanged, and for the agent the role is written even when \
empty — `agentFromEditorContent` always sets it, so clearing a role is \
expressible while clearing a title is not."""
steps = [
  "init --name proj --adapter claude",
  "task add 'Keep this title' --description 'original body' --priority 2 --quiet",
  "agent add shelly --adapter shell --command 'echo hi' --quiet",
  "task edit ${task.0}",
  "task show ${task.0} --json",
  "agent edit ${agent.0}",
  "agent status ${agent.0} --json",
]
