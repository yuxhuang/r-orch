name = "cmd-task-lifecycle"
kind = "differential"
requires = ["task show", "task assign", "task cancel", "task retry"]
description = """
The task subcommands that need no services: add, list, show, edit, assign, \
cancel, retry. Human output and --json for each, since the two renderings \
are separate code paths. Note `task retry` on a cancelled task is allowed \
and prints `Reset <id> to todo` (measured), which is the only way back out \
of a terminal status."""
steps = [
  "init --name proj --adapter claude",
  "task add 'First' --description 'the body' --priority 1 --labels a,b --quiet",
  "task add 'Second' --priority 4 --quiet",
  "task list",
  "task list --json",
  "task list --status todo --json",
  "task list --status done --json",
  "task show ${task.0}",
  "task show ${task.0} --json",
  "task assign ${task.0} agt_creator",
  "task show ${task.0} --json",
  "task cancel ${task.0}",
  "task list --json",
  "task retry ${task.0}",
  "task list --json",
]
