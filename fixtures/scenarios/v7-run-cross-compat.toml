name = "v7-run-cross-compat"
kind = "rust_then_ts"
split_at = 4
requires = ["run", "logs"]
fake_agents = true
timeout_secs = 90
description = """
V7 cross-compat over run artifacts: r-orch runs a task, then the \
TypeScript binary reads the run record and its JSONL events and runs \
another in the same directory. Catches a JSONL line or run record that \
only our own reader accepts."""
# Read-only steps only: each runs once per binary.
verify = [
  "task list --json",
  "logs --task ${task.0} --json",
]
steps = [
  "init --name proj --adapter claude",
  "agent add worker --adapter claude --quiet",
  "task add 'Rust runs this' --assignee ${agent.0} --quiet",
  "run ${task.0}",
  "task add 'TS runs this' --assignee ${agent.0} --quiet",
  "run ${task.1}",
  "task list --json",
]
