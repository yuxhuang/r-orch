name = "cmd-task-cross-compat-reverse"
kind = "rust_then_ts"
split_at = 4
requires = ["task show", "task assign"]
description = """
The direction that actually proves the shared-format claim: r-orch writes \
first and the oracle reads. A quoting bug in our writer is invisible to a \
same-binary test and to the ts-then-rust direction, but js-yaml will \
either throw here or read back a different value — the unquoted-timestamp \
hazard being the known example."""
# Read-only steps only: each runs once per binary.
verify = [
  "task list --json",
  "agent list --json",
  "task show ${task.0} --json",
]
steps = [
  "init --name proj --adapter claude",
  "agent add shelly --adapter shell --command 'echo hello' --quiet",
  "task add 'Written by rust' --assignee ${agent.0} --priority 1 --quiet",
  "task add 'Also by rust' --labels x,y --quiet",
  "task add 'Written by ts' --quiet",
  "task assign ${task.1} ${agent.0}",
  "task list --json",
]
