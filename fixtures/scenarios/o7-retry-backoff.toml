name = "o7-retry-backoff"
kind = "differential"
requires = ["serve", "config set", "status", "logs"]
timeout_secs = 120
env = { ORCH_FAKE_SCENARIO = "fail" }
description = """
Red-team O7 / V10 end to end: a failing agent must drive the task through \
retrying, then in_progress for each remaining attempt, then to failed — \
waiting min(base * 2^attempt, max) between tries. The delays are shortened \
through config, which both binaries read, so what gets compared is the \
arithmetic and the state sequence rather than the wall clock."""
steps = [
  "init --name proj --adapter claude",
  "config set scheduling.retry_base_delay_ms 200",
  "config set scheduling.retry_max_delay_ms 800",
  "config set scheduling.poll_interval_ms 200",
  "agent add flaky --adapter claude --quiet",
  "task add 'A task that always fails' --assignee ${agent.0} --max-attempts 3 --quiet",
  "serve --once --log-format json",
  "task list --json",
  "logs --task ${task.0} --json",
  "status --json",
]
