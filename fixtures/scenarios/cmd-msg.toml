name = "cmd-msg"
kind = "differential"
requires = ["msg send", "msg broadcast", "msg inbox", "msg list"]
description = """
Inter-agent messaging. Both `send` and `broadcast` print a JSON array, \
because broadcast fans out one message per recipient and the two share a \
code path. The subject is an option (`-s`), not a positional. Measured: \
broadcast excludes the sender and any disabled agent, so `--from \
agt_creator` in a one-agent tree prints `[]` rather than failing — a \
silent no-op worth pinning down.

One fan-out writes several messages with the same `created_at`, and \
`MessageStore.list` sorts only on that field, so their relative order is \
the `_index.json` tie-break — which the oracle fills via `Promise.all`, \
making it a libuv scheduling artifact that varies between runs. PARITY.md \
§6.10 says index order is not contract, so the listing steps and the index \
file are compared as multisets; every count, id and field is still \
compared."""
unordered_files = ["messages/_index.json"]
steps = [
  "init --name proj --adapter claude",
  "agent add second --adapter claude --quiet",
  "msg list",
  "@unordered:index-order-tie-break-§6.10 msg list --json",
  "msg send agt_creator 'hello there' -s Hi --json",
  "msg send ${agent.0} 'hello again' -s Hi",
  "msg broadcast 'to everyone' -s Announce --json",
  "msg broadcast 'nobody hears this' -s Quiet --from agt_creator --json",
  "@unordered:index-order-tie-break-§6.10 msg list --json",
  "msg list --agent agt_creator --json",
  "msg inbox agt_creator",
  "msg inbox agt_creator --json",
  "msg inbox ${agent.0} --json",
  "msg send agt_nosuch body -s S",
  "msg send agt_creator body -s S --ttl 0",
]
