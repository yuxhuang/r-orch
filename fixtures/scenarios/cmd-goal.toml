name = "cmd-goal"
kind = "differential"
requires = ["goal add", "goal list", "goal show", "goal status", "goal update", "goal delete"]
description = """
The goal subcommands and the goal state machine. Measured: an invalid \
*status name* exits 1 (`Invalid status "nonsense". Valid: active, paused, \
achieved, abandoned`), while a valid name that is not a legal transition \
exits 2 (`Cannot transition goal from 'achieved' to 'paused'`). Two \
different exit codes out of one subcommand, which is the sort of thing a \
reimplementation flattens."""
steps = [
  "init --name proj --adapter claude",
  "goal add 'Ship v2' --description 'Get it out' --quiet",
  "goal list",
  "goal list --json",
  "goal list --status active --json",
  "goal show ${goal.0}",
  "goal show ${goal.0} --json",
  "goal update ${goal.0} --title 'Ship v2, really' --json",
  "goal update ${goal.0} --assignee agt_creator --json",
  "goal status ${goal.0} paused --json",
  "goal status ${goal.0} active --json",
  "goal status ${goal.0} achieved --json",
  "goal status ${goal.0} paused",
  "goal status ${goal.0} nonsense",
  "goal list --json",
  "goal show goal_nosuch",
  "goal add 'Second goal' --quiet",
  "goal delete ${goal.1} --json",
  "goal delete ${goal.1} --json",
  "goal list --json",
]
