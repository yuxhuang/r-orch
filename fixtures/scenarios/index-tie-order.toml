name = "index-tie-order"
kind = "differential"
description = """
Closes the coverage gap README.md lists first: the four walking-skeleton \
commands never re-save an entity, so push-to-end and in-place update produce \
the same `_index.json` and the last-write order is unit-tested only. \
`agent disable agt_creator` re-saves an agent with a **deterministic** id, \
which moves it to the end of the index. Both trees are then compared, so a \
writer that updates in place diverges here. (`task assign` re-saves a task the \
same way, but a scenario step is a literal argv line and a task id is \
generated, so it cannot be named here — see the note in README.md.) The subsequent `agent list` shows the resulting order, since `_index.json` \
order is what the list walks."""
steps = [
  "init --name proj --adapter claude",
  "agent add shelly --adapter shell --command 'echo hello'",
  "agent add tess --adapter shell --command 'echo tess'",
  "agent list",
  # Re-saves the first agent: the index order becomes shelly, tess, agt_creator.
  "agent disable agt_creator",
  "agent list",
  "agent list --quiet",
  # And back: another re-save, so agt_creator ends up last again.
  "agent enable agt_creator",
  "agent list --quiet",
  # A second entity kind, to prove the index manager is not agent-specific.
  "task add 'First task'",
  "task add 'Second task'",
  "task list --quiet",
]
