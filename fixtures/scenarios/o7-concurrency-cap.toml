name = "o7-concurrency-cap"
kind = "differential"
requires = ["serve", "config set", "status"]
fake_agents = true
timeout_secs = 90
description = """
Red-team O7 / V36: six ready tasks against max_concurrent_agents = 2. The \
cap must never be exceeded, and the dispatch order, the claim/release \
sequence and the final tree must match the oracle. The priorities are \
deliberately tied in pairs so the tie-break order is exercised too — §14.4 \
is REPLICATE, so ties resolve by _index.json last-write order rather than \
by anything intrinsic to the agent.

Each task names its agent, so `agt_creator` — which has no auto approval \
policy, and whose task would therefore stop in `review`, which is not \
terminal — never claims one; otherwise `serve --once` would poll forever \
in **both** implementations. The tick records are dropped: which tasks are \
running when a tick fires is wall-clock timing, measured as a `running: 2` \
tick on one side against `running: 1` on the other. Every other record is \
compared, along with the resulting tree, the dispatch order in it, and the \
`status --json` summary; the cap itself is \
`dispatch_stops_at_the_concurrency_cap` in orch-engine."""
steps = [
  "init --name proj --adapter claude",
  "config set scheduling.max_concurrent_agents 2",
  "config set scheduling.poll_interval_ms 300",
  "agent add a1 --adapter claude --quiet",
  "agent add a2 --adapter claude --quiet",
  "agent add a3 --adapter claude --quiet",
  "task add one --priority 1 --assignee ${agent.0} --quiet",
  "task add two --priority 1 --assignee ${agent.1} --quiet",
  "task add three --priority 2 --assignee ${agent.2} --quiet",
  "task add four --priority 2 --assignee ${agent.0} --quiet",
  "task add five --priority 3 --assignee ${agent.1} --quiet",
  "task add six --priority 4 --assignee ${agent.2} --quiet",
  "@ticks-vary:heartbeat-is-timing serve --once --log-format json",
  "task list --json",
  "status --json",
]
