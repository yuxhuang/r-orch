name = "cmd-corrupt-lock"
kind = "differential"
requires = ["serve", "run"]
timeout_secs = 90
description = """
A lock file holding something that is not a PID (PARITY.md §14, ruled \
2026-10-13: replicate). Measured against the oracle, and it refutes the \
reading that ORCH proceeds without the lock — that describes \
`requireLock`, which **has no callers** in the TypeScript. The live path \
is `withTemporaryLock`/`startWatch`, which call `acquireLock` and throw \
`LockConflictError(lockResult.pid!)` on *any* failed acquisition. With no \
readable PID the template interpolates the literal string, so the message \
is `Orchestrator already running (PID: undefined)` and the exit code is 4 \
— which is why `DomainError:: LockConflict` carries an `Option<u32>` \
rather than collapsing a missing PID to 0. Two further replicated facts, \
both sent to the SRE reviewer as resilience findings rather than bugs to \
fix here: the lock file is **never cleared** when it blocks acquisition, \
so the project stays wedged until someone deletes it by hand — `orch \
status`, which the hint suggests, will not — and `serve:started` is logged \
*before* the lock check, so the JSON log carries a started record even on \
the refusal. The tree comparison covers "lock untouched" for free, since \
the lock lives in `.orchestry/`. The dead-PID case is deliberately absent: \
a successful acquisition rewrites the lock with the orchestrator's own \
PID, which differs between the two trees, and the lock file has no \
extension so it compares as text where PID normalization does not reach."""
steps = [
  "init --name proj --adapter claude",
  "agent add worker --adapter shell --command 'echo hello' --quiet",
  "task add 'blocked by a corrupt lock' --assignee ${agent.0} --quiet",
  "@write .orchestry/orchestry.lock not-a-pid-at-all",
  "serve --once --log-format json",
  "run ${task.0}",
  "@write .orchestry/orchestry.lock ''",
  "serve --once --log-format json",
  "task list --json",
]
