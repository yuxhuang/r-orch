name = "cmd-interleaved"
kind = "interleaved"
requires = ["task show", "agent status"]
description = """
Alternating binaries over one tree, which is the harshest ordering rule: \
each `task add` must land in _index.json at the end, so the two binaries' \
writes interleave into one order both agree on. §14.4 is REPLICATE, so the \
index order is semantic — it decides agent tie-breaking — and a save that \
rewrites the index sorted, or that updates in place rather than pushing to \
the end, diverges here while passing every single-binary test."""
# Read-only steps only: each runs once per binary.
verify = [
  "task list --json",
  "agent list --json",
]
steps = [
  "init --name proj --adapter claude",
  "agent add one --adapter claude --quiet",
  "task add alpha --quiet",
  "agent add two --adapter claude --quiet",
  "task add beta --quiet",
  "agent add three --adapter claude --quiet",
  "task add gamma --quiet",
  "task list --json",
]
