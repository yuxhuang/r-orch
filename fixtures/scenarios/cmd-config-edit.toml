name = "cmd-config-edit"
kind = "differential"
requires = ["config edit", "config get"]
fake_editor = "orch-edit-config"
description = """
`config edit` is the odd one out among the `$EDITOR` commands: it opens \
`.orchestry/config.yml` **directly** — no temporary buffer, no \
frontmatter, no parsing, and nothing printed on success — so what is \
compared is that both binaries hand the same path to the editor, keep the \
file the editor left, and read the new value back through their own \
parsers. Verified non-vacuous by hand: the value goes 6 → 2, so a \
`config edit` that opened nothing would fail the third step."""
steps = [
  "init --name proj --adapter claude",
  "config get scheduling.max_concurrent_agents --json",
  "config edit",
  "config get scheduling.max_concurrent_agents --json",
  "config get scheduling --json",
]
