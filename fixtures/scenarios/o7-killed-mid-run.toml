name = "o7-killed-mid-run"
kind = "rust_then_ts"
split_at = 6
requires = ["serve", "config set", "status"]
fake_agents = true
timeout_secs = 90
env = { ORCH_FAKE_SCENARIO = "slow", ORCH_FAKE_SLOW_SECONDS = "20" }
description = """
Red-team O7 / V25 and V35: an orchestrator killed mid-run. Deliberately \
cross-compat rather than differential — the kill must land once, in one \
shared tree. In two separate trees it would land at two different points \
and the trees would legitimately diverge, which makes the scenario flaky \
rather than wrong. After the kill the TypeScript binary recovers the same \
directory: the dead PID's task must become cancelled, its claim cleared \
and its preparing run finalized, and then both binaries must agree on what \
they read back."""
# Read-only steps only: each runs once per binary.
verify = [
  "task list --json",
  "status --json",
  "agent list --json",
]
steps = [
  "init --name proj --adapter claude",
  "config set scheduling.poll_interval_ms 300",
  "agent add slowpoke --adapter claude --quiet",
  "task add 'Interrupted work' --assignee ${agent.0} --quiet",
  "@kill-after:2500 serve --once --log-format json",
  "task list --json",
  "serve --once --log-format json",
  "task list --json",
]
