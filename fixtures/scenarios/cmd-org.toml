name = "cmd-org"
kind = "differential"
requires = ["org list", "org deploy"]
description = """
The org catalogue and a deployment. The 10 templates are L0 data, so `org \
list --json` is compared value for value. `org deploy` creates one agent \
per entry plus a team whose lead is the lead_index member, and the \
generated agent ids differ per tree — which is what the id normalization \
is for."""
steps = [
  "init --name proj --adapter claude",
  "org list",
  "org list --json",
  "org deploy data-lab",
  "agent list --json",
  "team list --json",
  "org deploy nosuch-org",
  "org deploy data-lab --goal 'ship the thing'",
  "goal list --json",
  "team list --json",
]
