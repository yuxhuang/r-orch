name = "cmd-edit-editor-failure"
kind = "differential"
requires = ["task edit"]
fake_editor = "orch-edit-fail"
description = """
An editor that exits non-zero. The oracle rejects it with `Editor exited \
with code 1` and saves nothing; the task must be byte-identical \
afterwards. This is the error path most likely to be implemented as \
"ignore the exit code and read the file anyway", which would silently save \
a half-finished edit."""
steps = [
  "init --name proj --adapter claude",
  "task add 'Survives a failed edit' --description 'original body' --quiet",
  "task edit ${task.0}",
  "task show ${task.0} --json",
]
