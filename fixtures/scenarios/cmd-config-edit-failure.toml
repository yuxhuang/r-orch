name = "cmd-config-edit-failure"
kind = "differential"
requires = ["config edit", "config get"]
fake_editor = "orch-edit-fail"
description = """
The failure path of the one `$EDITOR` command that edits a real file: a \
non-zero editor exit must surface as `Editor exited with code 1` and exit \
**1**, with `.orchestry/config.yml` untouched. A separate scenario because \
one scenario has one `$EDITOR`."""
steps = [
  "init --name proj --adapter claude",
  "config edit",
  "config get scheduling.max_concurrent_agents --json",
]
