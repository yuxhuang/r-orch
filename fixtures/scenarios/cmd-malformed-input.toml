name = "cmd-malformed-input"
kind = "differential"
# Declared, not merely exempted: these must be unreadable by js-yaml, or the
# scenario fails. See `unparseable_files` in xtask/src/scenario.rs.
unparseable_files = ["config.yml", "tasks/"]
requires = [
  "context set", "context get",
  "task add", "task show",
  "status",
]
description = """
A hand-corrupted file on disk, read by the command that actually opens it.

What is contract here is narrower than it looks, and the scenario exists to \
pin the narrow part. Both implementations exit **1**, print **nothing on \
stdout**, leave the offending file's bytes **exactly as found**, and mark the \
error on stderr with `  ✕ `. What is not contract is the reason text after \
that marker: it comes from js-yaml on one side and saphyr on the other, and \
TS additionally renders a source excerpt of one to five ` N | ` lines plus a \
`-----^` caret whose length varies with where the fault falls. Reimplementing \
js-yaml's wording and caret layout is not feasible and buys nothing, so the \
§14 malformed-input row records it as a known L0 divergence and every step \
below carries `@stderr-prefix-only`.

Each fault is read through a command that opens the file in question, which \
is less obvious than it sounds: the listing commands read `_index.json` and \
never touch the per-entity files, so `task list` and `context list` both \
succeed with a corrupt entity beneath them — in **both** implementations. \
`task show` and `context get` force the read.

A corrupt `_index.json` is included as a **positive control**, compared in \
full with no mask: neither implementation treats it as an error, because both \
catch the parse failure and rebuild from the entity files (§14.25). It earns \
its place by keeping the masked steps honest — a step comparing real output on \
the same tree, so the scenario is not only assertions that have been narrowed.

The config case comes last on purpose. Once `config.yml` is unreadable every \
later command fails on it instead of on the fault under test, so ordering it \
earlier would make the rest of the scenario assert the wrong thing.
"""
steps = [
  "init --name proj --adapter claude",
  "context set alpha 'a value'",
  "task add 'a task' --priority 1 --quiet",

  # Positive control first: a corrupt *index* is not an error in either
  # implementation. Both catch the parse failure and rebuild from the entity
  # files, so this step is compared in full — no mask. It is here to keep the
  # masked steps below honest: if the mask ever started hiding a real
  # difference, this step would still be comparing output on the same tree.
  "@write .orchestry/tasks/_index.json '{not json'",
  "task list",

  # JSON, through the per-key read. Measured: TS prints JSON.parse's own words
  # and no path (`  ✕ Unexpected end of JSON input` on a truncated object),
  # r-orch prints `  ✕ parse <path>` — the path and no reason. Neither is
  # derivable from the other, which is why the reason is masked.
  "@write .orchestry/context/alpha.json '{incomplete'",
  "@stderr-prefix-only:§14-malformed-input-json-parse-vs-serde_json-wording context get alpha",

  # YAML, through a task file.
  "@write .orchestry/tasks/${task.0}.yml '{{{ not yaml'",
  "@stderr-prefix-only:§14-malformed-input-js-yaml-reason-and-caret task show ${task.0}",

  # YAML, through the project config. Last: nothing works after this.
  "@write .orchestry/config.yml 'project: [unclosed'",
  "@stderr-prefix-only:§14-malformed-input-js-yaml-reason-and-caret status",
]
