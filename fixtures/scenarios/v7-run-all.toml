name = "v7-run-all"
kind = "differential"
requires = ["run", "task list", "logs"]
fake_agents = true
timeout_secs = 90
description = """
`run --all` with one agent and three tasks, which is the queue-draining \
path: the first dispatch fills the single slot, and each completion \
schedules the reactive dispatch that starts the next one. The original \
gets this for free — node stays alive while the agent's pipes and the \
500 ms debounce timer are open handles — so what is being checked is that \
r-orch's explicit wait reaches the same end state rather than exiting \
after the first run. Its own output is two fixed lines; everything \
interesting is in the tree."""
steps = [
  "init --name proj --adapter claude",
  "agent add worker --adapter claude --quiet",
  "task add 'First' --assignee ${agent.0} --quiet",
  "task add 'Second' --assignee ${agent.0} --quiet",
  "task add 'Third' --assignee ${agent.0} --quiet",
  "run --all",
  "task list --json",
  "logs --since 1h --json",
  "status --json",
]
