name = "cmd-edit-editor-noop"
kind = "differential"
requires = ["task edit"]
fake_editor = "orch-edit-noop"
description = """
An editor that closes without changing anything: both binaries must report \
no changes and leave updated_at alone, rather than writing an identical \
file back. A naive implementation that always saves looks correct in every \
other scenario and diverges only here — and only in the timestamp, which \
is normalized away in the text comparison but not in the ordering of `task \
list`."""
steps = [
  "init --name proj --adapter claude",
  "task add 'Untouched' --description 'original body' --quiet",
  "task show ${task.0} --json",
  "task edit ${task.0}",
  "task show ${task.0} --json",
  "task list --json",
]
