name = "cmd-ascii-glyph-coverage"
kind = "differential"
requires = ["task show", "status", "goal add", "context set"]
description = """
--ascii across every surface that draws a glyph, plus the one place it \
must *not* reach: an InvalidTransitionError keeps its U+2192 arrow under \
--ascii, because the message is built in the domain layer, which knows \
nothing about the flag (measured: `x Invalid transition for <id>: \
cancelled → cancelled`). An over-eager glyph pass that rewrites output on \
the way out would break exactly this and nothing else."""
steps = [
  "init --name proj --adapter claude",
  "task add 'One' --quiet",
  "task show tsk_nosuch",
  "--ascii task show tsk_nosuch",
  "task cancel ${task.0}",
  "task cancel ${task.0}",
  "--ascii task cancel ${task.0}",
  "--ascii task show ${task.0}",
  "--ascii status",
  "--ascii agent list",
  "--ascii goal add 'A goal'",
  "--ascii goal list",
  "--ascii context set k v",
  "--ascii context list",
  "--ascii context get nosuch",
]
