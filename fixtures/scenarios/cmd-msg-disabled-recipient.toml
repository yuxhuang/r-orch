name = "cmd-msg-disabled-recipient"
kind = "differential"
requires = ["msg broadcast", "agent disable"]
description = """
The broadcast recipient filter in isolation: a disabled agent receives \
nothing. Separate from cmd-msg so the fan-out count is the only thing that \
varies between the two runs of the same command."""
steps = [
  "init --name proj --adapter claude",
  "agent add second --adapter claude --quiet",
  "agent add third --adapter claude --quiet",
  "msg broadcast 'all three' -s One --json",
  "agent disable ${agent.0}",
  "msg broadcast 'only two' -s Two --json",
  "msg list --json",
  "msg inbox ${agent.0} --json",
]
