name = "cmd-context"
kind = "differential"
requires = ["context set", "context get", "context list", "context delete"]
description = """
The context store through the CLI, with three measured quirks: `context \
get <missing>` prints the error and exits 0 (and with --json prints the \
literal `null`); `context list` says "1 entries" without pluralising; and \
an out-of-range --ttl exits 1, not 2."""
steps = [
  "init --name proj --adapter claude",
  "context list",
  "context list --json",
  "context set alpha 'first value'",
  "context set alpha 'overwritten' --json",
  "context list",
  "context get alpha",
  "context get alpha --json",
  "context get nosuch",
  "context get nosuch --json",
  "context set zeta 'second value' --ttl 600000",
  "context list",
  "context list --json",
  "context set bad value --ttl 0",
  "context set bad value --ttl 99999999999",
  "context delete alpha",
  "context delete alpha",
  "context list --json",
]
