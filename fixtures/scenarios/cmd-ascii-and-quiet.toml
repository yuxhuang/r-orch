name = "cmd-ascii-and-quiet"
kind = "differential"
requires = ["agent list"]
description = """
The two global presentation flags that are L0, over the commands that \
exist today, and in both argument positions — measured: Commander accepts \
them before and after the subcommand, so both must work. --quiet prints \
ids only, which is also how every other scenario captures the ids it later \
substitutes."""
steps = [
  "init --name proj --adapter claude",
  "task add 'One' --quiet",
  "task add 'Two' --quiet",
  "task list",
  "--ascii task list",
  "task list --ascii",
  "--quiet task list",
  "task list --quiet",
  "--ascii task add 'Three'",
  "--quiet task add 'Four'",
  "--ascii --quiet task list",
  "--quiet agent add shelly --adapter shell --command 'echo hi'",
  "--ascii agent list",
]
