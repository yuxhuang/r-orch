name = "cmd-msg-truncation"
kind = "differential"
requires = ["msg send", "msg list"]
description = """
Subject truncated to 200 and body to 4000 — by JS `.slice()`, which counts \
**UTF-16 code units**, not characters or bytes. These are the cases where \
the cut lands cleanly between characters, so both implementations must \
agree exactly and nothing is excluded: a non-BMP emoji one unit inside the \
limit (so it is kept whole), one well under it, and a plain overflow by \
one single-unit character. The mid-pair case, where the two legitimately \
differ, is `cmd-msg-truncation-mid-pair`."""
steps = [
  "init --name proj --adapter claude",
  "msg send agt_creator '${repeat:c:3998}😀' -s '${repeat:d:198}😀' --json",
  "msg send agt_creator '${repeat:e:10}😀' -s '${repeat:f:10}😀' --json",
  "msg send agt_creator '${repeat:g:4001}' -s '${repeat:h:201}' --json",
  "msg list --json",
  "msg inbox agt_creator",
]
