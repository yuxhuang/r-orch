name = "cmd-msg-truncation"
kind = "differential"
requires = ["msg send", "msg list"]
description = """
Subject truncated to 200 and body to 4000 — by JS `.slice()`, which counts \
**UTF-16 code units**, not characters or bytes. Each argument here puts a \
non-BMP emoji (one character, two code units, four UTF-8 bytes) exactly \
astride the cut, which is the case Rust cannot represent at all. Measured \
against the oracle, and the two output paths disagree: * the body's code \
units 3999 and 4000 are the surrogate pair, so `.slice(0, 4000)` keeps \
only the **high surrogate**; * `--json` emits it as the literal six-byte \
escape `\\ud83d`, and the stored .json file contains those bytes and is \
valid UTF-8; * human output encodes the same lone surrogate as U+FFFD (ef \
bf bd). Both are byte-reproducible from Rust only with deliberate effort, \
and the *read* path is worse: serde_json rejects a lone surrogate escape \
outright ("unexpected end of hex escape"), so this one `msg send` writes a \
file our own storage layer cannot parse. See docs/TRAITS-FROZEN.md §11 — \
this needs an architect decision, and this scenario is the test for \
whatever it is. The second pair of steps is the benign control: the emoji \
sits one character earlier, so the cut falls between characters and both \
implementations should agree with no special handling."""
steps = [
  "init --name proj --adapter claude",
  "msg send agt_creator '${repeat:a:3999}😀' -s '${repeat:b:199}😀' --json",
  "msg send agt_creator '${repeat:c:3998}😀' -s '${repeat:d:198}😀' --json",
  "msg send agt_creator '${repeat:e:10}😀' -s '${repeat:f:10}😀' --json",
  "msg list --json",
  "msg inbox agt_creator",
]
