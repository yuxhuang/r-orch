# PR code: static checks plus one folded suite; docs: static/build only.
# Main retains folded plus independent ambient coverage. Separate jobs/receipts
# are a workflow result, never a qualifying standalone full gate bundle.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly: a new RUSTSEC advisory should surface on a quiet week too, not
  # only on the next PR. Runs the check job alone.
  schedule:
    - cron: '17 6 * * 1'

# Group by event and ref so weekly runs stay independent of main pushes.
# Newer PR and main pushes cancel superseded runs; weekly runs finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml points ORCHESTRY_GLOBAL_CONFIG_PATH into target/, so
  # ambient tests never touch ~/.orchestry on the runner. The folded gate
  # supplies its own sentinel HOME/global.yml outside the checkout.

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    env:
      CARGO_TARGET_DIR: target/ci-select
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config, which build scripts and the
          # cargo-deny container can read; nothing here pushes.
          persist-credentials: false
          fetch-depth: 0
      # dtolnay/rust-toolchain ignores rust-toolchain.toml (it requires an
      # explicit version), so let rustup read the file: one pin, not two.
      - run: rustup toolchain install
      # Registry/git dependencies only. All targets (gate-warm, gate-xtask,
      # cold gate, state/markers, gate-runs) and raw/export paths are excluded.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-bin: false
      - name: Classify changes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
            printf 'mode=all\n' >> "$GITHUB_OUTPUT"
            echo 'selection: main forces all'
          elif [[ "$EVENT" == pull_request ]]; then
            # Empty/unresolvable base conservatively selects all in the selector.
            cargo run --locked -p xtask -- gate select --base "$PR_BASE" --format github > "$RUNNER_TEMP/selection.txt"
            cat "$RUNNER_TEMP/selection.txt" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/selection.txt"
          else
            echo 'unsupported classification event' >&2
            exit 1
          fi
          git rev-parse HEAD 'HEAD^{tree}'

  check:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/ci-check
    steps:
      - name: Require valid classification
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule ]]; then
            [[ "$CHANGES_RESULT" == skipped && -z "$MODE" ]] || exit 1
          else
            [[ "$CHANGES_RESULT" == success ]] || exit 1
            case "$MODE" in
              docs-only|packages|all) ;;
              *) echo 'invalid classification mode' >&2; exit 1 ;;
            esac
            if [[ "$EVENT" == pull_request ]]; then
              :
            elif [[ "$EVENT" == push && "$REF" == refs/heads/main && "$MODE" == all ]]; then
              :
            else
              echo 'invalid classification event' >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config, which build scripts and the
          # cargo-deny container can read; nothing here pushes.
          persist-credentials: false
      # Lock guard also rejects a missing lockfile. Activated-graph deny alone
      # would miss termwiz/terminfo (WTFPL), see the ratatui manifest comment.
      - name: Cargo.lock has no termwiz/terminfo
        run: |
          test -s Cargo.lock
          ! grep -qE '^name = "(terminfo|termwiz)"$' Cargo.lock
      # dtolnay/rust-toolchain ignores rust-toolchain.toml (it requires an
      # explicit version), so let rustup read the file: one pin, not two.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-bin: false
      - name: Documentation build
        if: needs.changes.outputs.mode == 'docs-only'
        run: cargo build --workspace
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask crate-graph
      # Runs in its own container; checks advisories, licences, bans and sources.
      # Advisories are fetched live: a new RUSTSEC entry can redden an unchanged
      # tree. That is intended.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  test:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.result == 'success' && (needs.changes.outputs.mode == 'packages' || needs.changes.outputs.mode == 'all')
    runs-on: ubuntu-latest
    # Six Linux main runs peaked at 29m42s (test) and 28m46s (ambient).
    # The 40-minute ceiling adds headroom; the <=20-minute PR target remains.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config, which build scripts and the
          # cargo-deny container can read; nothing here pushes.
          persist-credentials: false
      # dtolnay/rust-toolchain ignores rust-toolchain.toml (it requires an
      # explicit version), so let rustup read the file: one pin, not two.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-bin: false
      # The TUI end-to-end tests drive the real binary in tmux and fail when
      # it is missing (AGENTS.md, "TUI end-to-end tests").
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # The suite runner is pinned: the gate refuses any other version and
      # prints this command. Built from crates.io with the tool's own lockfile
      # rather than fetched as a prebuilt binary or through a third-party
      # install action. Be clear about what that costs: this builds nextest's
      # own dependency tree -- a second, unvetted lockfile with its own build
      # scripts and proc-macros -- inside this job, and cargo-deny covers only
      # r-orch's Cargo.lock, not that one. Deliberately accepted per ADR 0022,
      # bounded by what the job can reach: a read-only token, a checkout that
      # persists no credentials, and no secrets. Cache only this executable;
      # a miss still builds from the locked crates.io source above.
      # No prefix fallback: a changed toolchain must build its own runner.
      - name: Restore nextest executable
        id: nextest-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nextest-bin/bin/cargo-nextest
          key: nextest-${{ runner.os }}-${{ runner.arch }}-0.9.152-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo install cargo-nextest --locked --version 0.9.152 --target-dir "$RUNNER_TEMP/nextest-install" --root "$HOME/.nextest-bin"
        if: steps.nextest-cache.outputs.cache-hit != 'true'
      - name: Activate pinned nextest
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.nextest-bin/bin" >> "$GITHUB_PATH"
          output="$("$HOME/.nextest-bin/bin/cargo-nextest" --version)"
          read -r program version rest <<< "$output"
          test "$program" = cargo-nextest && test "$version" = 0.9.152
      # PRs can read main's entry but never save one. Both main lanes use
      # the same immutable key/path; concurrent first saves are harmless.
      - name: Save nextest executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nextest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nextest-bin/bin/cargo-nextest
          key: ${{ steps.nextest-cache.outputs.cache-primary-key }}
      # Replace the step shell so runner cancellation signals reach the gate.
      # Export time under real cancellation remains unverified; no receipt guarantee.
      - name: Folded suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          exec ./xtask/gate.sh pr --part suite --receipt "$RUNNER_TEMP/pr3-suite-receipt" --lease-wait 5 --host-label github-hosted-linux
      # No continue-on-error/status mapping: producer failure independently
      # fails the job. Integrity can pass for FAILED/INCOMPLETE diagnostics.
      - name: Verify diagnostic receipt
        id: receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target/gate-xtask/debug/xtask gate evidence verify-receipt "$RUNNER_TEMP/pr3-suite-receipt" --commit "$(git rev-parse HEAD)"
      - name: Retain verified redacted receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr3-suite-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr3-suite-receipt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  ambient:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # concurrent_index reads this from its package cwd, so keep it absolute.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-ambient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config, which build scripts and the
          # cargo-deny container can read; nothing here pushes.
          persist-credentials: false
      # dtolnay/rust-toolchain ignores rust-toolchain.toml (it requires an
      # explicit version), so let rustup read the file: one pin, not two.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          cache-bin: false
      # The TUI end-to-end tests drive the real binary in tmux and fail when
      # it is missing (AGENTS.md, "TUI end-to-end tests").
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # The suite runner is pinned: the gate refuses any other version and
      # prints this command. Built from crates.io with the tool's own lockfile
      # rather than fetched as a prebuilt binary or through a third-party
      # install action. Be clear about what that costs: this builds nextest's
      # own dependency tree -- a second, unvetted lockfile with its own build
      # scripts and proc-macros -- inside this job, and cargo-deny covers only
      # r-orch's Cargo.lock, not that one. Deliberately accepted per ADR 0022,
      # bounded by what the job can reach: a read-only token, a checkout that
      # persists no credentials, and no secrets. Cache only this executable;
      # a miss still builds from the locked crates.io source above.
      # No prefix fallback: a changed toolchain must build its own runner.
      - name: Restore nextest executable
        id: nextest-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nextest-bin/bin/cargo-nextest
          key: nextest-${{ runner.os }}-${{ runner.arch }}-0.9.152-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo install cargo-nextest --locked --version 0.9.152 --target-dir "$RUNNER_TEMP/nextest-install" --root "$HOME/.nextest-bin"
        if: steps.nextest-cache.outputs.cache-hit != 'true'
      - name: Activate pinned nextest
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.nextest-bin/bin" >> "$GITHUB_PATH"
          output="$("$HOME/.nextest-bin/bin/cargo-nextest" --version)"
          read -r program version rest <<< "$output"
          test "$program" = cargo-nextest && test "$version" = 0.9.152
      # PRs can read main's entry but never save one. Both main lanes use
      # the same immutable key/path; concurrent first saves are harmless.
      - name: Save nextest executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nextest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nextest-bin/bin/cargo-nextest
          key: ${{ steps.nextest-cache.outputs.cache-primary-key }}
      # nextest runs the test binaries itself, so Cargo's `[env]` table has to
      # reach the test processes; xtask/tests/ambient_env.rs fails this job if
      # it does not. Doc-tests are libtest's own and stay a cargo run.
      #
      # Two passes, the same split the gate runs: the profiles' complementary
      # `default-filter`s in .config/nextest.toml are the only definition of
      # which tests run alone, and xtask/tests/nextest_isolation.rs fails if
      # these two steps and that file disagree. The second pass runs with
      # nothing beside it, which is the condition its binary needs.
      #
      # `if: ${{ !cancelled() }}` on every step after the first is this job's
      # `--no-fail-fast` across steps: one pass failing must not hide the other
      # pass's result or the doc-tests', which is the whole point of a job whose
      # failures are kept and diagnosed. A cancellation still stops the job, and
      # the job still fails if any step did.
      - run: cargo nextest run --profile default --workspace --no-fail-fast --no-tests fail
      - if: ${{ !cancelled() }}
        run: cargo nextest run --profile alone --workspace --no-fail-fast --no-tests fail
      - if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --no-fail-fast
