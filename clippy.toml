# Agent tie-breaking follows the last-write order of `_index.json`. That only holds if every sort over index
# order is stable, which Rust does not guarantee for the `*_unstable_*` family. The requirement is invisible in
# review and silently changes which agent gets picked, so it is enforced mechanically here.
#
# For a sort provably not over index order where performance matters, add
# `#[allow(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
    { path = "slice::sort_unstable", reason = "index order decides agent selection; use sort()" },
    { path = "slice::sort_unstable_by", reason = "index order decides agent selection; use sort_by()" },
    { path = "slice::sort_unstable_by_key", reason = "index order decides agent selection; use sort_by_key()" },
]

# Inside `#[cfg(test)]`, unwrap, print and dbg! are fine (see AGENTS.md, "Rust coding standards").
allow-unwrap-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
