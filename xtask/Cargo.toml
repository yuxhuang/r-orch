[package]
name = "xtask"
description = "Dev tooling for r-orch: crate-graph checks and Linux container runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# anyhow is allowed in xtask and orch-cli only — never in a library signature.
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
# Existing resolved Unix wrapper; native boundary uses only safe descriptor APIs.
nix = { workspace = true, features = ["fs", "dir", "user", "signal", "process"] }

# Safe Unix signal registration; no async subprocess rewrite or extra worker threads.
tokio = { workspace = true, features = ["rt", "signal", "time"] }

[lints]
workspace = true
