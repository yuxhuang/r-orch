[package]
name = "xtask"
description = "Dev tooling for r-orch: crate-graph checks and Linux container runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `fixture-gen` drives the real 1.0 file backend, so xtask reaches the stores directly. Normal edges
# only, with no test-support feature: `cargo xtask crate-graph` keeps test APIs on dev edges.
orch-core.workspace = true
orch-domain.workspace = true
orch-infra.workspace = true

# anyhow is allowed in xtask and orch-cli only — never in a library signature.
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Existing resolved Unix wrapper; native boundary uses only safe descriptor APIs.
nix = { workspace = true, features = ["fs", "dir", "user", "signal", "process", "hostname"] }

# Safe Unix signal registration; no async subprocess rewrite or extra worker threads.
tokio = { workspace = true, features = ["rt", "signal", "time"] }

# The generator builds each scenario in a private directory before comparing or publishing it.
tempfile.workspace = true

[lints]
workspace = true
