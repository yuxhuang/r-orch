[workspace]
resolver = "3"
members = [
    "crates/orch-domain",
    "crates/orch-core",
    "crates/orch-infra",
    "crates/orch-engine",
    "crates/orch-peer",
    "crates/orch-cli",
    "crates/orch-tui",
    "xtask",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/yuxhuang/r-orch"
# Nothing here is published. Besides preventing an irreversible accident, this
# is what lets `deny.toml`'s `allow-wildcard-paths` apply: cargo-deny treats a
# publishable crate's `*` path dependency as a real wildcard, because crates.io
# would reject the path and resolve it to any version.
publish = false

# Lints for every crate and test target. Library crates add stricter ones in their `lib.rs`
# (see AGENTS.md, "Rust coding standards").
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
# ── Internal ───────────────────────────────────────────────────────────────
orch-domain = { path = "crates/orch-domain" }
orch-core = { path = "crates/orch-core" }
orch-infra = { path = "crates/orch-infra" }
orch-engine = { path = "crates/orch-engine" }
orch-peer = { path = "crates/orch-peer" }
orch-tui = { path = "crates/orch-tui" }

# ── Core (ARCHITECTURE §4.1) ───────────────────────────────────────────────
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures = "0.3"
async-trait = "0.1"
# Lets the adapter event generators be written as straight-line async code, so
# they map onto the TS async generators one statement at a time and keep their
# pull-based semantics (ARCHITECTURE §4.8, PARITY.md §8.1).
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps Value key order on round-trip (ARCHITECTURE §5.2 rule 2).
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
nanoid = "0.5"

# ── YAML (ARCHITECTURE §4.2) ───────────────────────────────────────────────
# serde_yaml is archived; _ng is the maintained continuation with the same API.
# serde_norway 0.9 is the pre-vetted escape hatch.
serde_yaml_ng = "0.10"
# Event-based YAML scanner, used only to *count* a document's expanded size
# before `serde_yaml_ng` is allowed to build it (security review C0). Chosen
# over hand-rolling a scanner because alias and anchor bookkeeping is the whole
# problem: it reports anchor ids on nodes and on aliases, and assigns a fresh
# id when an anchor is redefined, so a redefinition is correct without special
# handling. Safe Rust, no libyaml.
saphyr-parser = "0.2"

# ── Document mutation (ADR 0005) ───────────────────────────────────────────
# RFC 7396 JSON Merge Patch for `orch ... patch --file` over serde_json::Value.
# Default features (the RFC 6902 `diff` generator) are off: only `merge` is used.
json-patch = { version = "4.2", default-features = false }

# ── Templates (ARCHITECTURE §4.3) ──────────────────────────────────────────
liquid = "0.26.11"

# ── TUI (ARCHITECTURE §4.4) ────────────────────────────────────────────────
ratatui = "0.30"
crossterm = "0.29"
# ARCHITECTURE §4.8 library-first, for the multi-line wizard textarea step
# (buffer, undo, word motions, soft wrapping, line numbers). This is the
# maintained ratatui-0.30 fork of `tui-textarea`, whose own 0.7.0 is pinned to
# ratatui 0.29 / crossterm 0.28 and cannot render into a 0.30 `Frame` (see the
# §4.8 block below). Verified: one ratatui and one crossterm in the graph.
tui-textarea-2 = "0.13"
# NFC normalisation for the grapheme cursor; the segmentation and width crates
# live in the §4.8 block below.
unicode-normalization = "0.1"

# ── Support (ARCHITECTURE §4.5) ────────────────────────────────────────────
jiff = "0.2"
nix = { version = "0.31", default-features = false }
tempfile = "3.27"
dirs = "7.0"
shell-words = "1.1"
globset = "0.4"
# Model-discovery parsers. `fancy-regex` is needed for the one Claude `--help`
# pattern that uses a lookahead, which the `regex` crate cannot express.
regex = "1.13"
fancy-regex = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = { version = "2.14", features = ["serde"] }
toml = "1.1"

# ── Library-first candidates (ARCHITECTURE §4.8) ───────────────────────────
# All verified on 2026-10-13 to resolve on rustc 1.94.1 *and* alongside
# ratatui 0.30.2 with a single ratatui in the graph. `unicode-segmentation`,
# `unicode-width`, `arboard` and `png` are in use; the rest are declared here
# so the owning package does not have to touch this manifest.
#
# `process-wrap` is declared but NOT adopted: the parity contract needs a
# pid-keyed kill/is_alive API with no child handle, and its group `wait()`
# would delay `ExitSignal` past node's `close`. The full reason is at the head
# of orch-infra/src/process/manager.rs (ARCHITECTURE §4.8 exemption (b)).
#
# `tui-textarea` is deliberately ABSENT: 0.7.0 (its latest) hard-depends on
# ratatui 0.29.0 and crossterm 0.28.1, so a `TextArea` cannot be rendered into
# a ratatui 0.30 `Frame` and adding it puts two ratatui versions in the graph.
# WP-6 resolved this by adopting `tui-textarea-2` 0.13 (the maintained 0.30
# fork, declared in the TUI block above) for the multi-line wizard steps.
#
# `tui-input` is unused: WP-6's single-line editor needs a kill ring, two undo
# flavours and a 500 ms snapshot debounce (docs/parity/tui.md §2.4), none of
# which `tui-input` models, so it is hand-written over the crates below.
#
# Process groups: prefer this over a hand-rolled setsid + kill(-pid); keep
# `nix` for kill(pid, 0) liveness (ARCHITECTURE §4.8, §5.5).
process-wrap = { version = "10", features = ["tokio1"] }
# Single-line text editing for the TUI command bar and `text` wizard steps.
tui-input = "0.15"
# Replaces Intl.Segmenter + width logic for `text-cursor` parity.
unicode-segmentation = "1.13"
unicode-width = "0.2"
# Clipboard. Degrade to "empty" on any failure, exactly as the TS does.
arboard = "3.6"
# PNG-encodes clipboard images (already in the tree via arboard).
png = "0.18"

# ── Web (`orch web`) ───────────────────────────────────────────────────────
# Serves the TUI to a browser: a pty running `orch tui`, bridged over a
# websocket to xterm.js. Only the pieces that bridge needs are enabled.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
portable-pty = "0.9"
# Basic-auth header decoding; already in the tree via axum.
base64 = "0.22"
# Credentials are compared as SHA-256 digests (fixed length, so the comparison
# leaks neither content nor length) with `subtle`'s constant-time equality.
# Held on the 0.10 `digest` line that axum's websocket `sha1` already brings
# in; move it to 0.11 together with axum, or there are two of everything.
sha2 = "0.10"
subtle = "2.6"

# ── Dev (ARCHITECTURE §4.6) ────────────────────────────────────────────────
insta = "1.49"
assert_cmd = "2.2"
# Not used yet. Declared so WP-2/WP-5 can reach for it without touching the
# root manifest (ARCHITECTURE §4.6).
proptest = "1.12"
# Diffs in the parity harness and in test failures (ARCHITECTURE §4.8).
similar = "3.2"
pretty_assertions = "1.4"
# Websocket client for the `orch web` bridge test.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

# Disk is tight and debuginfo is the bulk of a dev build's target/ size.
[profile.dev]
debug = 0

[profile.test]
debug = 0
