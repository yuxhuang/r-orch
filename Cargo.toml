[workspace]
resolver = "3"
members = [
    "crates/orch-domain",
    "crates/orch-core",
    "crates/orch-infra",
    "crates/orch-engine",
    "crates/orch-cli",
    "crates/orch-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/oxgeneral/r-orch"

[workspace.dependencies]
# ── Internal ───────────────────────────────────────────────────────────────
orch-domain = { path = "crates/orch-domain" }
orch-core = { path = "crates/orch-core" }
orch-infra = { path = "crates/orch-infra" }
orch-engine = { path = "crates/orch-engine" }
orch-tui = { path = "crates/orch-tui" }

# ── Core (ARCHITECTURE §4.1) ───────────────────────────────────────────────
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps Value key order on round-trip (ARCHITECTURE §5.2 rule 2).
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
nanoid = "0.5"

# ── YAML (ARCHITECTURE §4.2) ───────────────────────────────────────────────
# serde_yaml is archived; _ng is the maintained continuation with the same API.
# serde_norway 0.9 is the pre-vetted escape hatch.
serde_yaml_ng = "0.10"

# ── Templates (ARCHITECTURE §4.3) ──────────────────────────────────────────
liquid = "0.26.11"
# liquid 0.26.11 resolves kstring 2.0.5, whose MSRV (1.96.0) exceeds our pinned
# toolchain (1.94.1). 2.0.2 is the newest version that builds on 1.94.1.
# Remove this pin only together with a toolchain bump.
kstring = "2.0.2"

# ── TUI (ARCHITECTURE §4.4) ────────────────────────────────────────────────
ratatui = "0.30"
crossterm = "0.29"
# ARCHITECTURE §4.8 library-first: the wizard textarea step (multi-line editing,
# undo, word motions, soft wrapping, line numbers). `tui-textarea` 0.7 is pinned
# to ratatui 0.29 and would pull a second ratatui+crossterm stack; `-2` is the
# maintained ratatui-0.30 continuation and also adds the soft-wrap/visual-row
# cursor support the wizard needs (docs/parity/tui.md §5.1).
tui-textarea-2 = "0.13"
unicode-segmentation = "1.13"
unicode-width = "0.2"
unicode-normalization = "0.1"

# ── Support (ARCHITECTURE §4.5) ────────────────────────────────────────────
jiff = "0.2"
nix = { version = "0.31", default-features = false }
tempfile = "3.27"
dirs = "7.0"
which = "8.0"
shell-words = "1.1"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = { version = "2.14", features = ["serde"] }
toml = "1.1"

# ── Dev (ARCHITECTURE §4.6) ────────────────────────────────────────────────
insta = "1.49"
assert_cmd = "2.2"
predicates = "3.1"
# Not used yet. Declared so WP-2/WP-5 can reach for it without touching the
# root manifest (ARCHITECTURE §4.6).
proptest = "1.12"

# Disk is tight and debuginfo is the bulk of a dev build's target/ size.
[profile.dev]
debug = 0

[profile.test]
debug = 0
