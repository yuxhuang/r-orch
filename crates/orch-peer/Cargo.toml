[package]
name = "orch-peer"
description = "Owner-only TCP peer links and worker mirror execution for orch."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orch-domain.workspace = true
orch-core.workspace = true
orch-infra.workspace = true
orch-engine.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync", "time", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
orch-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
