[package]
name = "orch-infra"
description = "Implementations of the orch-core port traits: storage, adapters, process, workspace, templates, skills."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orch-domain.workspace = true
orch-core.workspace = true

arboard.workspace = true
async-stream.workspace = true
async-trait.workspace = true
dirs.workspace = true
fancy-regex.workspace = true
futures.workspace = true
indexmap.workspace = true
jiff.workspace = true
liquid.workspace = true
# Pinned for the toolchain MSRV — see the root manifest.
kstring.workspace = true
nanoid.workspace = true
png.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
saphyr-parser.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "process",
    "signal",
    "sync",
    "time",
] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "user"] }

[dev-dependencies]
orch-core = { workspace = true, features = ["test-support"] }
insta.workspace = true
tempfile.workspace = true
# `test-util` gives `#[tokio::test(start_paused = true)]`, so the stream's 30 s
# file wait and the lock's staleness window cost no wall-clock time.
tokio = { workspace = true, features = ["test-util", "macros", "rt", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
