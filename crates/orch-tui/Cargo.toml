[package]
name = "orch-tui"
description = "ratatui dashboard for r-orch."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orch-domain.workspace = true

indexmap.workspace = true
# Use ratatui's crossterm re-export in code to avoid a version clash; this
# entry exists for the few places that need the crate path directly.
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tracing.workspace = true
tui-textarea-2.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
