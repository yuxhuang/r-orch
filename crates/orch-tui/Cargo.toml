[package]
name = "orch-tui"
description = "ratatui dashboard for r-orch."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orch-domain.workspace = true

indexmap.workspace = true
# Use ratatui's crossterm re-export in code to avoid a version clash; this
# entry exists for the few places that need the crate path directly.
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tracing.workspace = true
tui-textarea-2.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
# `poll(2)` with POLLHUP: the only way to tell a dead terminal from an idle
# one, since crossterm reports no EOF or hang-up (src/tty.rs).
# ARCHITECTURE §4.8 keeps `nix` for exactly this class of POSIX check, and
# this crate forbids `unsafe_code`, so raw `libc::poll` is not available.
nix = { workspace = true, features = ["poll"] }

[lints]
workspace = true
