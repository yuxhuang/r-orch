<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch</title>
<link rel="stylesheet" href="/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  #term { height: 100%; padding: 4px; box-sizing: border-box; }
  #status {
    position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px;
    background: #b00020; color: #fff; font: 14px sans-serif; text-align: center;
  }
  #status[hidden], #copy-panel[hidden], #copy-fallback[hidden] { display: none; }
  #copy-panel {
    position: fixed; bottom: 8px; right: 8px; max-width: min(32em, 90vw);
    padding: 8px; background: #222; color: #fff; font: 14px sans-serif;
    border: 1px solid #888;
  }
  #copy-panel button:focus-visible, #copy-fallback:focus-visible { outline: 2px solid #fff; }
  #copy-fallback { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; }

</style>
</head>
<body>
<div id="term"></div>
<div id="status" hidden>Disconnected. Reload the page to start a new session.</div>
<section id="copy-panel" aria-label="Terminal clipboard request" hidden>
  <button id="copy-button" type="button" disabled>Copy to clipboard</button>
  <button id="copy-dismiss" type="button">Dismiss</button>
  <span id="copy-status" role="status" aria-live="polite"></span>
  <textarea id="copy-fallback" aria-label="Text to select and copy" readonly hidden></textarea>
</section>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script>
  const MAX_CHUNK = 16 * 1024; // the server bounds incoming messages
  const encoder = new TextEncoder();
  const term = new Terminal({
    cursorBlink: true,
    fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
    fontSize: 14,
    // `orch tui` holds mouse reporting, which takes click-drag selection
    // away from the browser. Option+drag forces a local selection on macOS;
    // Shift+drag does elsewhere. F2 or /mouse release the pointer entirely.
    macOptionClickForcesSelection: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();

  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  // Carry the access token from the page URL, when there is one, to the socket.
  const params = new URLSearchParams({ cols: term.cols, rows: term.rows });
  const token = new URLSearchParams(location.search).get('token');
  if (token) params.set('token', token);
  const ws = new WebSocket(`${scheme}//${location.host}/ws?${params}`);
  ws.binaryType = 'arraybuffer';

  function sendBytes(bytes) {
    for (let i = 0; i < bytes.length; i += MAX_CHUNK) {
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(bytes.subarray(i, i + MAX_CHUNK));
    }
  }

  const copyPanel = document.getElementById('copy-panel');
  const copyButton = document.getElementById('copy-button');
  const copyStatus = document.getElementById('copy-status');
  const copyFallback = document.getElementById('copy-fallback');
  const MAX_COPY_BYTES = 64 * 1024;
  const MAX_COPY_BASE64 = 4 * Math.ceil(MAX_COPY_BYTES / 3);
  let pendingCopy = null;
  let copyGeneration = 0;
  let copyWriting = false;

  function clearCopy() {
    copyGeneration++;
    pendingCopy = null;
    copyButton.disabled = true;
    copyFallback.value = '';
    copyFallback.hidden = true;
    copyStatus.textContent = '';
    copyPanel.hidden = true;
  }

  function copyFallbackMessage(message) {
    copyStatus.textContent = message;
    copyFallback.value = pendingCopy;
    copyFallback.hidden = false;
  }

  // A terminal request carries data, not browser activation or success. Keep
  // one bounded request and require a fresh click before invoking the browser.
  term.parser.registerOscHandler(52, (data) => {
    clearCopy();
    copyPanel.hidden = false;
    try {
      if (!data.startsWith('c;')) throw new Error();
      const encoded = data.slice(2);
      if (encoded.length > MAX_COPY_BASE64 ||
          !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
        throw new Error();
      }
      const decoded = atob(encoded);
      if (decoded.length > MAX_COPY_BYTES || btoa(decoded) !== encoded) throw new Error();
      const bytes = Uint8Array.from(decoded, (c) => c.charCodeAt(0));
      pendingCopy = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(bytes);
      copyButton.disabled = copyWriting;
      copyStatus.textContent = 'Terminal copy requested; click Copy to clipboard.';
      if (!isSecureContext || !navigator.clipboard?.writeText) {
        copyFallbackMessage('Clipboard unavailable in this insecure or unsupported browser. Select and copy the text below.');
      }
    } catch {
      pendingCopy = null;
      copyStatus.textContent = 'Terminal clipboard request rejected: invalid UTF-8/base64 or over 64 KiB.';
    }
    return true; // consume queries and malformed input too; never read a clipboard
  });

  copyButton.onclick = async () => {
    if (pendingCopy === null || copyButton.disabled) return;
    if (!isSecureContext || !navigator.clipboard?.writeText) {
      copyFallbackMessage('Clipboard unavailable in this insecure or unsupported browser. Select and copy the text below.');
      return;
    }
    const generation = copyGeneration;
    copyWriting = true;
    copyButton.disabled = true;
    try {
      await navigator.clipboard.writeText(pendingCopy);
      if (generation !== copyGeneration) return;
      clearCopy();
      copyPanel.hidden = false;
      copyStatus.textContent = 'Copied in browser.';
    } catch {
      if (generation !== copyGeneration) return;
      copyButton.disabled = false;
      copyFallbackMessage('Clipboard permission denied or unavailable. Select and copy the text below.');
    } finally {
      copyWriting = false;
      copyButton.disabled = pendingCopy === null;
    }
  };
  document.getElementById('copy-dismiss').onclick = clearCopy;

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) term.write(new Uint8Array(event.data));
  };
  ws.onclose = () => {
    clearCopy();
    document.getElementById('status').hidden = false;
    term.write('\r\n\x1b[31m[disconnected]\x1b[0m\r\n');
  };

  term.onData((data) => sendBytes(encoder.encode(data)));
  // Legacy mouse reports are raw bytes in a string, not UTF-8 text.
  term.onBinary((data) => sendBytes(Uint8Array.from(data, (c) => c.charCodeAt(0))));
  term.onResize(({ cols, rows }) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'resize', cols, rows }));
  });
  window.addEventListener('resize', () => fit.fit());
  term.focus();
</script>
</body>
</html>
