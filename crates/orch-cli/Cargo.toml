[package]
name = "orch-cli"
description = "clap command tree, output rendering and serve mode for r-orch. Hosts the three binaries."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# All three names are the same program, matching the npm `bin` map. The clap
# program name stays `orchestry` so `--help` matches. They are three one-line
# shims over `orch_cli::run` rather than three targets sharing one `main.rs`:
# cargo warns on the latter ("found to be present in multiple build targets")
# and compiles it three times.
[[bin]]
name = "orch"
path = "src/bin/orch.rs"

[[bin]]
name = "orchestry"
path = "src/bin/orchestry.rs"

[[bin]]
name = "ao"
path = "src/bin/ao.rs"

[dependencies]
orch-domain.workspace = true
orch-core.workspace = true
orch-engine.workspace = true
orch-infra.workspace = true
orch-peer.workspace = true
orch-tui.workspace = true

# anyhow is allowed here and in xtask only — never in a library signature.
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
# Raw mode and key events for the agent shop picker (§21.2). The TUI owns the
# dashboard; this is one modal list.
crossterm.workspace = true
futures.workspace = true
indexmap.workspace = true
# `logs` renders event times in the local zone, as `toLocaleTimeString` does.
jiff.workspace = true
nanoid.workspace = true
portable-pty.workspace = true
sha2.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "process",
    "signal",
    "sync",
    "time",
] }
tokio-util.workspace = true
# `$EDITOR` buffers live in a temporary directory, as in the reference, and
# the TUI's clipboard-paste directory needs a real `mkdtemp` (docs/parity/
# tui.md §8.2): atomic, 0700 and collision-free, which a hand-built name is
# not. Already a production dependency of orch-infra.
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# SIGHUP, then SIGKILL after a grace period, for the `orch web` pty child.
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
orch-core = { workspace = true, features = ["test-support"] }
assert_cmd.workspace = true
insta.workspace = true
tokio-tungstenite.workspace = true
# `TestBackend` for the end-to-end dashboard test (tests/tui_dashboard.rs):
# the real `orch-tui` App over the real engine, rendered into a buffer.
ratatui.workspace = true
tempfile.workspace = true

[lints]
workspace = true
